    <style>
        body {
            font-family: 'Noto Serif SC', serif;
            background-color: #f5f5f4; /* stone-100 */
            color: #1c1917;
        }
        .font-mono { font-family: 'Fira Code', monospace; }
        .font-flower { font-family: 'Great Vibes', cursive; } /* 花体字 */
        .font-serif-en { font-family: 'Playfair Display', serif; } /* 英文衬线 */
        .font-song-thin { font-family: 'Noto Serif SC', serif; font-weight: 200; } /* 宋体细体 */

        /* Chart Container */
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            height: 300px;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #999; }

        /* Glitch Animation for Algo Dishes */
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
        .animate-glitch:hover {
            animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
        }

        /* Fade In Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        /* Toast Animation */
        @keyframes slideDown {
            from { transform: translate(-50%, -100%); opacity: 0; }
            to { transform: translate(-50%, 20px); opacity: 1; }
        }
        .animate-slide-down {
            animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        /* Progress Bar Animation */
        @keyframes progress {
            from { width: 100%; }
            to { width: 0%; }
        }

                let nextMenu = [...menu];
                
                // Identify target categories from last order
                const orderedCategories = [...new Set(lastCart.map(d => d.category))];

                orderedCategories.forEach(catId => {
                    // Find dishes in this category
                    const catDishes = nextMenu.filter(d => d.category === catId);
                    if (catDishes.length < 5) return; // Skip if too few items

                    // Identify "Cold" dishes (lowest orderCount), excluding recently ordered
                    const lastOrderedIds = lastCart.map(d => d.id);
                    const candidates = catDishes
                        .filter(d => !lastOrderedIds.includes(d.id))
                        .sort((a, b) => a.orderCount - b.orderCount);

                    // Replace bottom 2-3 dishes
                    const toReplace = candidates.slice(0, 3);
                    
                    // Generate new dishes inspired by what was ordered in this category
                    // If multiple dishes ordered in same cat, pick one random inspiration
                    const inspirationDish = lastCart.find(d => d.category === catId) || catDishes[0];

                    toReplace.forEach(oldDish => {
                        const newDish = generateEvolution(inspirationDish);
                        // Replace in the main array
                        const index = nextMenu.findIndex(d => d.id === oldDish.id);
                        if (index !== -1) {
                            nextMenu[index] = newDish;
                        }
                    });
                });

                setMenu(nextMenu);
            };

            // Handle Restart (Triggers Evolution)
            const handleRestart = () => {
                evolveMenu(cart); // Run algorithm based on current cart
                setCart([]); // Clear cart
                setShowCheckout(false); // Close dashboard
                setIsCartOpen(false);
                setStarted(false); // Go back to Intro
            };

            // Modified Handle Order: Just tracks data, doesn't replace immediately
            const handleOrder = (dish) => {
                // 1. Add to cart
                setCart(prev => [...prev, dish]);
                showToast(`Added to cart: ${dish.name} (已加入购物车)`); 
                
                // 2. Update local order counts for the algorithm to track "popularity"
                setMenu(prev => prev.map(item => 
                    item.id === dish.id 
                    ? { ...item, orderCount: item.orderCount + 1 }
                    : item
                ));

                // 3. Update global stats
                setUserStats(prev => ({
                    totalClicks: prev.totalClicks + 1,
                    catCounts: { ...prev.catCounts, [dish.category]: (prev.catCounts[dish.category] || 0) + 1 }
                }));
            };

            // Sorting logic (unchanged)
            const sortedDishes = useMemo(() => {
                let filtered = activeCat === 'all' ? menu : menu.filter(d => d.category === activeCat);
                const counts = userStats.catCounts;
                const favCat = Object.keys(counts).reduce((a, b) => (counts[a] > counts[b] ? a : b), null);
                const favCatScore = counts[favCat] || 0;

                return filtered.map(dish => {
                    let score = dish.orderCount * 10; // Weight by actual orders now
                    if (favCat && dish.category === favCat) score += 20;
                    if (dish.type === 'generated') score += 15;
                    return { ...dish, sortScore: score };
                }).sort((a, b) => b.sortScore - a.sortScore);
            }, [menu, activeCat, userStats]);

            if (!started) return <Intro onStart={() => setStarted(true)} />;

            return (
                <div className="min-h-screen bg-stone-50 text-stone-900 font-sans">
                    {toast && (
                        <div className="fixed top-24 left-1/2 transform -translate-x-1/2 z-[100] bg-stone-800 text-white text-sm px-6 py-3 rounded-full shadow-xl animate-slide-down flex items-center gap-2 border border-stone-600/50 backdrop-blur-md w-max max-w-[90vw]">
                            <span>✅</span>
                            <span className="font-serif tracking-wide truncate">{toast}</span>
                        </div>
                    )}

                    <CartSidebar 
                        cart={cart} 
                        isOpen={isCartOpen} 
                        onClose={() => setIsCartOpen(false)} 
                        onRemove={(idx) => setCart(prev => prev.filter((_, i) => i !== idx))}
                        onCheckout={() => setShowCheckout(true)}
                    />

                    {showCheckout && (
                        <Dashboard cart={cart} onClose={() => setShowCheckout(false)} onRestart={handleRestart} />
                    )}

                    <div className="pb-20 animate-fade-in relative">
                        <header className="sticky top-0 z-30 bg-stone-50/90 backdrop-blur-md border-b border-stone-200 px-4 py-3 flex justify-between items-center shadow-sm">
                            <div className="flex items-center gap-2 font-flower font-bold text-3xl text-stone-800">
                                <span>Restauruuun</span>
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="text-[10px] font-mono text-stone-400 text-right hidden sm:block">
                                    <div>ORDERS: {userStats.totalClicks}</div>
                                    <div>EVOLUTION: PENDING</div>
                                </div>
                                <button onClick={() => setIsCartOpen(true)} className="relative p-2 bg-stone-200 rounded-full hover:bg-stone-300 transition-colors">
                                    <ShoppingBagIcon />
                                    {cart.length > 0 && (
                                        <span className="absolute -top-1 -right-1 bg-cyan-600 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">
                                            {cart.length}
                                        </span>
                                    )}
                                </button>
                            </div>
                        </header>

                        <nav className="sticky top-[60px] z-20 bg-stone-50/95 border-b border-stone-100 overflow-x-auto no-scrollbar py-3 px-4 flex gap-2">
                            {CATEGORIES.map(cat => (
                                <button
                                    key={cat.id}
                                    onClick={() => setActiveCat(cat.id)}
                                    className={`whitespace-nowrap px-4 py-2 rounded-full text-xs font-bold transition-all border
                                        ${activeCat === cat.id 
                                            ? 'bg-stone-800 text-white border-stone-800 shadow-md transform scale-105' 
                                            : 'bg-white border-stone-200 text-stone-500 hover:bg-stone-100 hover:border-stone-300'}
                                    `}
                                >
                                    {cat.label}
                                </button>
                            ))}
                        </nav>

                        <main className="max-w-7xl mx-auto px-4 py-8">
                            <div className="flex items-end justify-between mb-8 pb-4 border-b border-stone-200">
                                <div>
                                    <h2 className="text-3xl font-serif-en italic text-stone-800">
                                        {CATEGORIES.find(c => c.id === activeCat)?.name}
                                    </h2>
                                    <span className="text-sm font-song-thin text-stone-500 mt-1 block">
                                        {CATEGORIES.find(c => c.id === activeCat)?.label}
                                    </span>
                                </div>
                                <span className="text-xs font-mono text-stone-400">
                                    {sortedDishes.length} Items
                                </span>
                            </div>

                            <div className="mb-8 p-4 bg-stone-100 rounded-lg border-l-4 border-stone-300">
                                <p className="text-sm text-stone-600 font-song-thin leading-relaxed">
                                    {activeCat === 'all' 
                                        ? "Our dish will run away, run away~ (Restauruuun的菜品可不会等人，会变来变去哦)" 
                                        : `Browsing ${CATEGORIES.find(c => c.id === activeCat)?.name}. Can you distinguish the algorithmic noise? (您正在浏览该分类。请仔细甄别是否混入了算法噪声？)`}
                                </p>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-x-6 gap-y-10">
                                {sortedDishes.map((dish, idx) => (
                                    <DishCard 
                                        key={dish.id} 
                                        dish={dish} 
                                        onOrder={handleOrder} 
                                        rank={idx + 1}
                                    />
                                ))}
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
